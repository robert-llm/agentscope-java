# ==============================
# agentscope-robert 模块配置
# ==============================

server.port=${SERVER_PORT:18096}

# Spring Application Name
spring.application.name=agentscope-robert

# Disable Spring Boot banner
spring.main.banner-mode=on

# ==============================
# A2A Server Configuration
# ==============================
agentscope.a2a.server.enabled=true
agentscope.a2a.server.card.name=doctor-assistant
agentscope.a2a.server.card.description=\u667a\u80fd\u52a9\u624b\uff0c\u652f\u6301\u591a\u8f6e\u5bf9\u8bdd\u548c\u5de5\u5177\u8c03\u7528
agentscope.a2a.server.card.version=1.0.0

# ==============================
# Nacos A2A Registry & Discovery
# ==============================
agentscope.a2a.nacos.enabled=true
agentscope.a2a.nacos.server-addr=${NACOS_SERVER_ADDR:10.36.21.120:8848}
agentscope.a2a.nacos.username=${NACOS_USERNAME:nacos}
agentscope.a2a.nacos.password=${NACOS_PASSWORD:nacos}
agentscope.a2a.nacos.registry.enabled=true
agentscope.a2a.nacos.discovery.enabled=true
