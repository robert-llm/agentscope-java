    a2a:
        server:
            enabled: true
            card:
                name: Robert-A2A-test
                description: 基于 AgentScope 的智能助手测试

        nacos:
            server-addr: ${NACOS_SERVER_ADDRESS:localhost:8848}
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWORD:nacos}
            namespace: dev
            discovery:
                enabled: true
