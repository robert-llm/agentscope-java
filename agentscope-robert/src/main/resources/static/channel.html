<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Channel - 流式事件调试器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: #161b22;
            padding: 12px 20px;
            border-bottom: 1px solid #30363d;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .header h1 { font-size: 15px; color: #58a6ff; font-weight: 600; }
        .header .config {
            display: flex; align-items: center; gap: 10px; font-size: 12px;
        }
        .header .config label { color: #8b949e; }
        .header .config select, .header .config input {
            padding: 4px 8px; border: 1px solid #30363d; border-radius: 6px;
            font-size: 12px; background: #0d1117; color: #c9d1d9; outline: none;
        }
        .header .config select:focus, .header .config input:focus { border-color: #58a6ff; }

        /* Stats bar */
        .stats-bar {
            background: #161b22;
            padding: 6px 20px;
            border-bottom: 1px solid #30363d;
            font-size: 11px;
            color: #8b949e;
            display: flex;
            gap: 16px;
            flex-shrink: 0;
            font-family: 'Consolas', monospace;
        }
        .stats-bar span { display: inline-flex; align-items: center; gap: 4px; }
        .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
        .dot.green { background: #3fb950; }
        .dot.blue { background: #58a6ff; }
        .dot.yellow { background: #d29922; }
        .dot.red { background: #f85149; }
        .dot.purple { background: #d2a8ff; }

        /* Event timeline */
        .timeline {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        /* Event row */
        .event-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 13px;
            line-height: 1.5;
            animation: fadeIn 0.15s ease-in;
            border-left: 3px solid transparent;
        }
        .event-row:hover { background: #161b22; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-2px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Seq number */
        .seq {
            color: #484f58;
            font-size: 11px;
            font-family: 'Consolas', monospace;
            min-width: 32px;
            text-align: right;
            padding-top: 2px;
        }

        /* Event type badge */
        .type-badge {
            font-size: 10px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            min-width: 90px;
            text-align: center;
            flex-shrink: 0;
        }

        /* Event content */
        .event-content {
            flex: 1;
            word-break: break-word;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 12px;
        }

        /* Source tag */
        .source-tag {
            font-size: 10px;
            color: #8b949e;
            background: #21262d;
            padding: 1px 6px;
            border-radius: 3px;
            flex-shrink: 0;
        }

        /* ---- Event type colors ---- */
        .event-row.text_delta { border-left-color: #c9d1d9; background: #161b22; }
        .event-row.text_delta .type-badge { background: #1f2937; color: #79c0ff; }

        .event-row.think_delta { border-left-color: #d2a8ff; background: #1a1525; }
        .event-row.think_delta .type-badge { background: #271c3e; color: #d2a8ff; }

        .event-row.agent_start { border-left-color: #3fb950; }
        .event-row.agent_start .type-badge { background: #0d3321; color: #3fb950; }

        .event-row.agent_end { border-left-color: #8b949e; }
        .event-row.agent_end .type-badge { background: #21262d; color: #8b949e; }

        .event-row.tool_call { border-left-color: #d29922; }
        .event-row.tool_call .type-badge { background: #2a1f05; color: #d29922; }

        .event-row.tool_result { border-left-color: #bc8c24; }
        .event-row.tool_result .type-badge { background: #2a1f05; color: #bc8c24; }

        .event-row.subagent_exposed { border-left-color: #58a6ff; }
        .event-row.subagent_exposed .type-badge { background: #0c2d6b; color: #58a6ff; }

        .event-row.done { border-left-color: #3fb950; }
        .event-row.done .type-badge { background: #0d3321; color: #3fb950; }

        .event-row.error { border-left-color: #f85149; background: #2d1214; }
        .event-row.error .type-badge { background: #3d1214; color: #f85149; }

        .event-row.user_msg { border-left-color: #58a6ff; background: #0c2d6b33; }
        .event-row.user_msg .type-badge { background: #0c2d6b; color: #58a6ff; }

        .event-row.other { border-left-color: #484f58; }
        .event-row.other .type-badge { background: #21262d; color: #8b949e; }

        /* Separator */
        .event-row.lifecycle-sep {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed #21262d;
        }

        /* Input area */
        .input-area {
            background: #161b22;
            padding: 12px 20px;
            border-top: 1px solid #30363d;
            display: flex;
            gap: 10px;
            align-items: flex-end;
            flex-shrink: 0;
        }
        .input-area textarea {
            flex: 1; padding: 8px 12px; border: 1px solid #30363d; border-radius: 8px;
            font-size: 13px; font-family: inherit; resize: none; outline: none;
            min-height: 40px; max-height: 100px; background: #0d1117; color: #c9d1d9;
            line-height: 1.5;
        }
        .input-area textarea:focus { border-color: #58a6ff; }
        .input-area button {
            padding: 8px 24px; background: #238636; color: #fff; border: none;
            border-radius: 8px; font-size: 13px; cursor: pointer; white-space: nowrap;
        }
        .input-area button:hover { background: #2ea043; }
        .input-area button:disabled { background: #21262d; color: #484f58; cursor: not-allowed; }

        /* Scrollbar */
        .timeline::-webkit-scrollbar { width: 6px; }
        .timeline::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>⚡ Channel - 流式事件调试器</h1>
        <div class="config">
            <span style="color:#3fb950;font-weight:600;">🤖 Coordinator (自动路由)</span>
            <label>用户:</label>
            <input id="userId" value="user-1" style="width:90px" />
        </div>
    </div>

    <div class="stats-bar" id="statsBar">
        <span><span class="dot green"></span> events: <b id="statEvents">0</b></span>
        <span><span class="dot blue"></span> text: <b id="statText">0</b></span>
        <span><span class="dot purple"></span> think: <b id="statThink">0</b></span>
        <span><span class="dot yellow"></span> tool: <b id="statTool">0</b></span>
        <span><span class="dot red"></span> errors: <b id="statErrors">0</b></span>
        <span>⏱ elapsed: <b id="statElapsed">-</b></span>
    </div>

    <div class="timeline" id="timeline">
        <!-- Events will be appended here -->
    </div>

    <div class="input-area">
        <textarea id="msgInput" placeholder="输入消息... (Enter 发送, Shift+Enter 换行)" rows="1"></textarea>
        <button id="sendBtn" onclick="sendMessage()">发送</button>
    </div>

    <script>
        const timeline = document.getElementById('timeline');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');
        const userIdInput = document.getElementById('userId');

        let seqCounter = 0;
        let startTime = 0;
        let elapsedTimer = null;

        // ---- Message buffer: aggregate small chunks (MIN_DISPLAY_LEN = 10) ----
        const MIN_DISPLAY_LEN = 10;
        let textBuffer = '';
        let textBufferSource = null;
        let textBufferStartSeq = null;
        let thinkBuffer = '';
        let thinkBufferSource = null;
        let thinkBufferStartSeq = null;

        // Stats
        let stats = { events: 0, text: 0, think: 0, tool: 0, errors: 0 };

        function updateStats() {
            document.getElementById('statEvents').textContent = stats.events;
            document.getElementById('statText').textContent = stats.text;
            document.getElementById('statThink').textContent = stats.think;
            document.getElementById('statTool').textContent = stats.tool;
            document.getElementById('statErrors').textContent = stats.errors;
        }

        function startElapsed() {
            startTime = Date.now();
            if (elapsedTimer) clearInterval(elapsedTimer);
            elapsedTimer = setInterval(() => {
                const ms = Date.now() - startTime;
                document.getElementById('statElapsed').textContent =
                    ms < 1000 ? ms + 'ms' : (ms / 1000).toFixed(1) + 's';
            }, 100);
        }

        function stopElapsed() {
            if (elapsedTimer) { clearInterval(elapsedTimer); elapsedTimer = null; }
        }

        // ---- Keyboard & resize ----
        msgInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        msgInput.addEventListener('input', () => {
            msgInput.style.height = 'auto';
            msgInput.style.height = Math.min(msgInput.scrollHeight, 100) + 'px';
        });

        // ---- Add event row ----
        function addEventRow(cssType, seq, source, content, isSep) {
            const row = document.createElement('div');
            row.className = `event-row ${cssType}`;
            if (isSep) row.classList.add('lifecycle-sep');

            // Seq
            const seqSpan = document.createElement('span');
            seqSpan.className = 'seq';
            seqSpan.textContent = seq != null ? '#' + seq : '';
            row.appendChild(seqSpan);

            // Type badge
            const badge = document.createElement('span');
            badge.className = 'type-badge';
            badge.textContent = cssType;
            row.appendChild(badge);

            // Source tag (if present)
            if (source) {
                const tag = document.createElement('span');
                tag.className = 'source-tag';
                tag.textContent = source;
                row.appendChild(tag);
            }

            // Content
            const contentSpan = document.createElement('span');
            contentSpan.className = 'event-content';
            contentSpan.textContent = content;
            row.appendChild(contentSpan);

            timeline.appendChild(row);
            timeline.scrollTop = timeline.scrollHeight;
            return contentSpan;
        }

        function addSeparator(text) {
            const sep = document.createElement('div');
            sep.style.cssText = 'text-align:center;padding:8px 0 4px;color:#484f58;font-size:11px;font-family:Consolas,monospace;';
            sep.textContent = text;
            timeline.appendChild(sep);
            timeline.scrollTop = timeline.scrollHeight;
        }

        // ---- Flush buffered text/think ----
        function flushTextBuffer() {
            if (textBuffer.length > 0) {
                addEventRow('text_delta', textBufferStartSeq, textBufferSource, textBuffer, false);
                textBuffer = '';
                textBufferSource = null;
                textBufferStartSeq = null;
            }
        }

        function flushThinkBuffer() {
            if (thinkBuffer.length > 0) {
                addEventRow('think_delta', thinkBufferStartSeq, thinkBufferSource, thinkBuffer, false);
                thinkBuffer = '';
                thinkBufferSource = null;
                thinkBufferStartSeq = null;
            }
        }

        function flushAll() {
            flushTextBuffer();
            flushThinkBuffer();
        }

        // ---- Send message ----
        async function sendMessage() {
            const message = msgInput.value.trim();
            if (!message) return;

            msgInput.value = '';
            msgInput.style.height = 'auto';
            sendBtn.disabled = true;
            seqCounter = 0;

            // Reset stats
            stats = { events: 0, text: 0, think: 0, tool: 0, errors: 0 };
            updateStats();

            const userId = userIdInput.value.trim() || 'user-1';
            const sessionId = 'session-' + userId;

            // User message row
            addEventRow('user_msg', null, 'coordinator', message, true);
            addSeparator('▼ Channel 流式响应');
            startElapsed();

            // Build SSE URL
            const params = new URLSearchParams({
                message: message,
                userId: userId,
                sessionId: sessionId
            });

            try {
                const response = await fetch(`/api/channel/chat/stream?${params}`, {
                    method: 'GET',
                    headers: { 'Accept': 'text/event-stream' }
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';

                    for (const line of lines) {
                        if (line.startsWith('data:')) {
                            const dataStr = line.substring(5).trim();
                            if (!dataStr) continue;
                            try {
                                const frame = JSON.parse(dataStr);
                                stats.events++;
                                handleEvent(frame);
                                updateStats();
                            } catch (e) {
                                // Skip non-JSON
                            }
                        }
                    }
                }
            } catch (err) {
                stats.errors++;
                updateStats();
                flushAll();
                addEventRow('error', null, null, '请求失败: ' + err.message, false);
            }

            flushAll();
            stopElapsed();
            addSeparator('▼ 结束 (' + stats.events + ' events, ' +
                document.getElementById('statElapsed').textContent + ')');

            sendBtn.disabled = false;
            msgInput.focus();
        }

        // ---- Handle each AgentEvent frame ----
        function handleEvent(frame) {
            const type = frame.type || '';
            const source = frame.source || null;
            seqCounter++;
            const seq = seqCounter;

            switch (type) {
                // ---- Streaming text: buffer and aggregate to MIN_DISPLAY_LEN ----
                case 'TEXT_BLOCK_DELTA': {
                    stats.text++;
                    const delta = frame.delta || '';
                    if (delta.length === 0) return;

                    // Source 切换时先 flush
                    if (textBufferSource !== source) flushTextBuffer();
                    if (!textBufferStartSeq) textBufferStartSeq = seq;
                    textBufferSource = source;
                    textBuffer += delta;

                    // 达到阈值则 flush 显示
                    if (textBuffer.length >= MIN_DISPLAY_LEN) flushTextBuffer();
                    return;
                }

                // ---- Streaming think: buffer and aggregate ----
                case 'THINKING_BLOCK_DELTA': {
                    stats.think++;
                    const delta = frame.delta || '';
                    if (delta.length === 0) return;

                    if (thinkBufferSource !== source) flushThinkBuffer();
                    if (!thinkBufferStartSeq) thinkBufferStartSeq = seq;
                    thinkBufferSource = source;
                    thinkBuffer += delta;

                    if (thinkBuffer.length >= MIN_DISPLAY_LEN) flushThinkBuffer();
                    return;
                }

                // ---- Non-streaming events: flush buffers first ----
                default:
                    flushAll();

                    let content = '';
                    let isSep = false;
                    let cssType = 'other';

                    switch (type) {
                        case 'AGENT_START':
                            content = `agent started: ${frame.name || ''} (role: ${frame.role || 'assistant'}, session: ${frame.sessionId || '-'})`;
                            isSep = true;
                            cssType = 'agent_start';
                            break;

                        case 'AGENT_END':
                            content = `agent ended (reply: ${frame.replyId || '-'})`;
                            isSep = true;
                            cssType = 'agent_end';
                            break;

                        case 'TOOL_CALL_START':
                            content = `tool: ${frame.toolCallName || 'unknown'}`;
                            stats.tool++;
                            cssType = 'tool_call';
                            break;

                        case 'TOOL_RESULT_TEXT_DELTA':
                            content = frame.delta || '';
                            stats.tool++;
                            cssType = 'tool_result';
                            break;

                        case 'SUBAGENT_EXPOSED':
                            content = `subagent exposed: ${frame.label || frame.agentId || '-'} (id: ${frame.subagentId || '-'})`;
                            isSep = true;
                            cssType = 'subagent_exposed';
                            break;

                        case 'DONE':
                            content = 'stream complete';
                            isSep = true;
                            cssType = 'done';
                            break;

                        case 'ERROR':
                            content = frame.message || 'unknown error';
                            stats.errors++;
                            cssType = 'error';
                            break;

                        // Lifecycle events
                        case 'TEXT_BLOCK_START':
                            content = 'text block start';
                            cssType = 'text_delta';
                            break;
                        case 'TEXT_BLOCK_END':
                            content = 'text block end';
                            cssType = 'text_delta';
                            break;
                        case 'THINKING_BLOCK_START':
                            content = 'thinking block start';
                            isSep = true;
                            cssType = 'think_delta';
                            break;
                        case 'THINKING_BLOCK_END':
                            content = 'thinking block end';
                            cssType = 'think_delta';
                            break;
                        case 'MODEL_CALL_START':
                            content = 'model call start';
                            isSep = true;
                            cssType = 'other';
                            break;
                        case 'MODEL_CALL_END':
                            content = 'model call end';
                            cssType = 'other';
                            break;
                        case 'AGENT_RESULT':
                            content = 'agent result';
                            isSep = true;
                            cssType = 'agent_end';
                            break;

                        default:
                            content = type + (frame.delta ? ': ' + frame.delta : '');
                            break;
                    }

                    addEventRow(cssType, seq, source, content, isSep);
                    break;
            }
        }

        // Focus input on load
        msgInput.focus();
    </script>
</body>
</html>
