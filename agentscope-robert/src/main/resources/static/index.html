<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Router Agent - 流式事件调试器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: #161b22;
            padding: 12px 20px;
            border-bottom: 1px solid #30363d;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .header h1 { font-size: 15px; color: #58a6ff; font-weight: 600; }
        .header .config {
            display: flex; align-items: center; gap: 10px; font-size: 12px;
        }
        .header .config label { color: #8b949e; }
        .header .config input {
            padding: 4px 8px; border: 1px solid #30363d; border-radius: 6px;
            font-size: 12px; background: #0d1117; color: #c9d1d9; outline: none;
        }
        .header .config input:focus { border-color: #58a6ff; }

        /* Main layout */
        .main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Event timeline (left) */
        .timeline {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        /* Event row */
        .event-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 13px;
            line-height: 1.5;
            animation: fadeIn 0.15s ease-in;
            border-left: 3px solid transparent;
        }
        .event-row:hover { background: #161b22; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-2px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Seq number */
        .seq {
            color: #484f58;
            font-size: 11px;
            font-family: 'Consolas', monospace;
            min-width: 32px;
            text-align: right;
            padding-top: 2px;
        }

        /* Event type badge */
        .type-badge {
            font-size: 10px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            min-width: 90px;
            text-align: center;
            flex-shrink: 0;
        }

        /* Event content */
        .event-content {
            flex: 1;
            word-break: break-word;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 12px;
        }

        /* Agent tag */
        .agent-tag {
            font-size: 10px;
            color: #8b949e;
            background: #21262d;
            padding: 1px 6px;
            border-radius: 3px;
            flex-shrink: 0;
        }

        /* ---- Event type colors ---- */
        .event-row.workflow_started { border-left-color: #3fb950; }
        .event-row.workflow_started .type-badge { background: #0d3321; color: #3fb950; }

        .event-row.workflow_finished { border-left-color: #3fb950; }
        .event-row.workflow_finished .type-badge { background: #0d3321; color: #3fb950; }

        .event-row.plan { border-left-color: #d29922; }
        .event-row.plan .type-badge { background: #2a1f05; color: #d29922; }

        .event-row.node_started { border-left-color: #58a6ff; }
        .event-row.node_started .type-badge { background: #0c2d6b; color: #58a6ff; }

        .event-row.node_finished { border-left-color: #8b949e; }
        .event-row.node_finished .type-badge { background: #21262d; color: #8b949e; }

        .event-row.message { border-left-color: #c9d1d9; background: #161b22; }
        .event-row.message .type-badge { background: #1f2937; color: #79c0ff; }

        .event-row.think { border-left-color: #d2a8ff; background: #1a1525; }
        .event-row.think .type-badge { background: #271c3e; color: #d2a8ff; }

        .event-row.think_time { border-left-color: #d2a8ff; }
        .event-row.think_time .type-badge { background: #271c3e; color: #d2a8ff; }

        .event-row.message_end { border-left-color: #3fb950; }
        .event-row.message_end .type-badge { background: #0d3321; color: #3fb950; }

        .event-row.error { border-left-color: #f85149; background: #2d1214; }
        .event-row.error .type-badge { background: #3d1214; color: #f85149; }

        /* Separator for lifecycle events */
        .event-row.lifecycle-sep {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed #21262d;
        }

        /* Input area */
        .input-area {
            background: #161b22;
            padding: 12px 20px;
            border-top: 1px solid #30363d;
            display: flex;
            gap: 10px;
            align-items: flex-end;
            flex-shrink: 0;
        }
        .input-area textarea {
            flex: 1; padding: 8px 12px; border: 1px solid #30363d; border-radius: 8px;
            font-size: 13px; font-family: inherit; resize: none; outline: none;
            min-height: 40px; max-height: 100px; background: #0d1117; color: #c9d1d9;
            line-height: 1.5;
        }
        .input-area textarea:focus { border-color: #58a6ff; }
        .input-area button {
            padding: 8px 24px; background: #238636; color: #fff; border: none;
            border-radius: 8px; font-size: 13px; cursor: pointer; white-space: nowrap;
        }
        .input-area button:hover { background: #2ea043; }
        .input-area button:disabled { background: #21262d; color: #484f58; cursor: not-allowed; }

        /* Stats bar */
        .stats-bar {
            background: #161b22;
            padding: 6px 20px;
            border-bottom: 1px solid #30363d;
            font-size: 11px;
            color: #8b949e;
            display: flex;
            gap: 16px;
            flex-shrink: 0;
            font-family: 'Consolas', monospace;
        }
        .stats-bar span { display: inline-flex; align-items: center; gap: 4px; }
        .stats-bar .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
        .stats-bar .dot.green { background: #3fb950; }
        .stats-bar .dot.blue { background: #58a6ff; }
        .stats-bar .dot.yellow { background: #d29922; }
        .stats-bar .dot.red { background: #f85149; }

        /* Scrollbar */
        .timeline::-webkit-scrollbar { width: 6px; }
        .timeline::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }

        /* User message display */
        .event-row.user-msg {
            border-left-color: #58a6ff;
            background: #0c2d6b33;
        }
        .event-row.user-msg .type-badge {
            background: #0c2d6b; color: #58a6ff;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>⚡ Router Agent - 流式事件调试器</h1>
        <div class="config">
            <label>API:</label>
            <input id="apiUrl" value="http://localhost:18096" style="width:170px" />
            <label>目标Agent:</label>
            <input id="targetAgent" placeholder="自动路由" style="width:110px" />
            <label>用户:</label>
            <input id="loginName" value="tester" style="width:70px" />
        </div>
    </div>

    <div class="stats-bar" id="statsBar">
        <span><span class="dot green"></span> events: <b id="statEvents">0</b></span>
        <span><span class="dot blue"></span> messages: <b id="statMessages">0</b></span>
        <span><span class="dot yellow"></span> thinks: <b id="statThinks">0</b></span>
        <span><span class="dot red"></span> errors: <b id="statErrors">0</b></span>
        <span>⏱ elapsed: <b id="statElapsed">-</b></span>
    </div>

    <div class="timeline" id="timeline">
        <!-- Events will be appended here -->
    </div>

    <div class="input-area">
        <textarea id="msgInput" placeholder="输入消息... (Enter 发送, Shift+Enter 换行)" rows="1"></textarea>
        <button id="sendBtn" onclick="sendMessage()">发送</button>
    </div>

    <script>
        const timeline = document.getElementById('timeline');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');
        const apiUrlInput = document.getElementById('apiUrl');
        const targetAgentInput = document.getElementById('targetAgent');
        const loginNameInput = document.getElementById('loginName');

        let msgCounter = 0;
        let startTime = 0;
        let elapsedTimer = null;

        // ---- Message buffer: aggregate small chunks ----
        const MIN_DISPLAY_LEN = 10; // 最小显示字符数
        let msgBuffer = '';      // message 缓冲区
        let msgBufferAgent = null;
        let msgBufferStartSeq = null;
        let thinkBuffer = '';    // think 缓冲区
        let thinkBufferAgent = null;
        let thinkBufferStartSeq = null;

        // Stats
        let stats = { events: 0, messages: 0, thinks: 0, errors: 0 };

        function updateStats() {
            document.getElementById('statEvents').textContent = stats.events;
            document.getElementById('statMessages').textContent = stats.messages;
            document.getElementById('statThinks').textContent = stats.thinks;
            document.getElementById('statErrors').textContent = stats.errors;
        }

        function startElapsed() {
            startTime = Date.now();
            if (elapsedTimer) clearInterval(elapsedTimer);
            elapsedTimer = setInterval(() => {
                const ms = Date.now() - startTime;
                document.getElementById('statElapsed').textContent =
                    ms < 1000 ? ms + 'ms' : (ms / 1000).toFixed(1) + 's';
            }, 100);
        }

        function stopElapsed() {
            if (elapsedTimer) { clearInterval(elapsedTimer); elapsedTimer = null; }
        }

        // ---- Keyboard & resize ----
        msgInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        msgInput.addEventListener('input', () => {
            msgInput.style.height = 'auto';
            msgInput.style.height = Math.min(msgInput.scrollHeight, 100) + 'px';
        });

        // ---- Add event row ----
        function addEventRow(type, seq, agentId, content, isSep) {
            const row = document.createElement('div');
            row.className = `event-row ${type}`;
            if (isSep) row.classList.add('lifecycle-sep');

            // Seq
            const seqSpan = document.createElement('span');
            seqSpan.className = 'seq';
            seqSpan.textContent = seq != null ? '#' + seq : '';
            row.appendChild(seqSpan);

            // Type badge
            const badge = document.createElement('span');
            badge.className = 'type-badge';
            badge.textContent = type;
            row.appendChild(badge);

            // Agent tag (if present)
            if (agentId) {
                const tag = document.createElement('span');
                tag.className = 'agent-tag';
                tag.textContent = agentId;
                row.appendChild(tag);
            }

            // Content
            const contentSpan = document.createElement('span');
            contentSpan.className = 'event-content';
            contentSpan.textContent = content;
            row.appendChild(contentSpan);

            timeline.appendChild(row);
            timeline.scrollTop = timeline.scrollHeight;

            return contentSpan;
        }

        // ---- Send message ----
        async function sendMessage() {
            const question = msgInput.value.trim();
            if (!question) return;

            msgInput.value = '';
            msgInput.style.height = 'auto';
            sendBtn.disabled = true;
            msgCounter++;

            // Reset stats
            stats = { events: 0, messages: 0, thinks: 0, errors: 0 };
            updateStats();

            // User message as event
            addEventRow('user_msg', null, null, question, true);

            // Separator
            addSeparator('▼ 流式响应');

            startElapsed();

            const baseUrl = apiUrlInput.value.replace(/\/+$/, '');
            const targetAgent = targetAgentInput.value.trim();
            const loginName = loginNameInput.value.trim() || 'tester';
            const msgId = 'msg-' + Date.now() + '-' + msgCounter;

            const body = {
                question: question,
                conversationId: 'conv-' + Date.now(),
                messageId: msgId,
                loginName: loginName
            };
            if (targetAgent) {
                body.targetTeams = [targetAgent];
            }

            try {
                const response = await fetch(`${baseUrl}/api/router/stream`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';

                    for (const line of lines) {
                        if (line.startsWith('data:')) {
                            const dataStr = line.substring(5).trim();
                            if (!dataStr) continue;
                            try {
                                const frame = JSON.parse(dataStr);
                                stats.events++;
                                handleEvent(frame);
                                updateStats();
                            } catch (e) {
                                // Skip non-JSON
                            }
                        }
                    }
                }
            } catch (err) {
                stats.errors++;
                updateStats();
                addEventRow('error', null, null, '请求失败: ' + err.message, false);
            }

            flushAll();
            stopElapsed();
            addSeparator('▼ 结束 (' + stats.events + ' events, ' +
                document.getElementById('statElapsed').textContent + ')');

            sendBtn.disabled = false;
            msgInput.focus();
        }

        function addSeparator(text) {
            const sep = document.createElement('div');
            sep.style.cssText = 'text-align:center;padding:8px 0 4px;color:#484f58;font-size:11px;font-family:Consolas,monospace;';
            sep.textContent = text;
            timeline.appendChild(sep);
            timeline.scrollTop = timeline.scrollHeight;
        }

        // ---- Flush buffered message/think ----
        function flushMsgBuffer() {
            if (msgBuffer.length > 0) {
                addEventRow('message', msgBufferStartSeq, msgBufferAgent, msgBuffer, false);
                msgBuffer = '';
                msgBufferAgent = null;
                msgBufferStartSeq = null;
            }
        }

        function flushThinkBuffer() {
            if (thinkBuffer.length > 0) {
                addEventRow('think', thinkBufferStartSeq, thinkBufferAgent, thinkBuffer, false);
                thinkBuffer = '';
                thinkBufferAgent = null;
                thinkBufferStartSeq = null;
            }
        }

        function flushAll() {
            flushMsgBuffer();
            flushThinkBuffer();
        }

        // ---- Handle each RouterEvent ----
        function handleEvent(frame) {
            const type = frame.event;
            const seq = frame.seq;
            const agentId = frame.agentId || null;
            const data = frame.data || {};

            switch (type) {
                // ---- Streaming text: buffer and aggregate ----
                case 'message': {
                    const chunk = data.answer || '';
                    stats.messages++;
                    if (chunk.length === 0) return;

                    // Agent 切换时先 flush
                    if (msgBufferAgent !== agentId) flushMsgBuffer();

                    if (!msgBufferStartSeq) msgBufferStartSeq = seq;
                    msgBufferAgent = agentId;
                    msgBuffer += chunk;

                    // 达到阈值则 flush
                    if (msgBuffer.length >= MIN_DISPLAY_LEN) flushMsgBuffer();
                    return;
                }

                case 'think': {
                    const chunk = data.answer || '';
                    stats.thinks++;
                    if (chunk.length === 0) return;

                    if (thinkBufferAgent !== agentId) flushThinkBuffer();

                    if (!thinkBufferStartSeq) thinkBufferStartSeq = seq;
                    thinkBufferAgent = agentId;
                    thinkBuffer += chunk;

                    if (thinkBuffer.length >= MIN_DISPLAY_LEN) flushThinkBuffer();
                    return;
                }

                // ---- Non-streaming events: flush buffers first, then display ----
                default:
                    flushAll();

                    let content = '';
                    let isSep = false;

                    switch (type) {
                        case 'workflow_started':
                            content = 'workflow started'; isSep = true; break;
                        case 'workflow_finished':
                            content = 'workflow finished'; isSep = true; break;
                        case 'plan': {
                            const nodeList = data.nodeList || [];
                            const finished = data.finished || 0;
                            const names = nodeList.map(n => n.agentId || n.id || '?').join(' → ');
                            content = `plan: [${names}] (${finished} done)`; isSep = true; break;
                        }
                        case 'node_started':
                            content = 'node started'; isSep = true; break;
                        case 'node_finished':
                            content = 'node finished'; isSep = true; break;
                        case 'think_time':
                            content = data.think_time || 'thinking...'; stats.thinks++; break;
                        case 'message_end':
                            content = 'stream complete'; isSep = true; break;
                        case 'error':
                            content = data.message || 'unknown error'; stats.errors++; break;
                        default:
                            content = JSON.stringify(data); break;
                    }

                    addEventRow(type, seq, agentId, content, isSep);
                    break;
            }
        }

        // Focus input on load
        msgInput.focus();
    </script>
</body>
</html>
