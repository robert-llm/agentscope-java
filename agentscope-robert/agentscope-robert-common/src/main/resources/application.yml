server:
  port: 18099

# OAuth2 Resource Server 配置
oauth2:
  resource-server:
    # JWT 签名密钥（生产环境请使用更复杂的随机字符串，至少 32 字符）
    jwt-secret: agentscope-robert-default-jwt-secret-key-2026-must-be-at-least-256-bits
    # Token 有效期（秒），默认 24 小时
    jwt-expiration-seconds: 86400
    # Token 签发者标识
    issuer: agentscope-robert
    # 是否启用 OAuth2 认证（开发环境可设为 false 跳过认证）
    enabled: true
  # 预注册 OAuth2 客户端
  clients:
    - client-id: workbuddy_robert
      client-secret: wb_secret_robert_2026_secure_key
      redirect-uris:
        - http://localhost:9002/route
        - http://localhost:18099/oauth2-callback.html
      scopes:
        - read
        - write
      enabled: true

# SpringDoc / Swagger 配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
