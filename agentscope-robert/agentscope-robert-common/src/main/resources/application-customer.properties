# ==============================
# agentscope-robert 模块配置
# ==============================

server.port=${SERVER_PORT:18101}

# Spring Application Name
spring.application.name=agentscope-robert-common

# ===== AgentScope Higress =====
# 看当前项目路径下start_higress.sh 脚本中higress启动配置端口，路径后缀weather-service是自定义的,robert.com 需要在/etc/hosts 文件中映射到127.0.0.1
agentscope.higress.mcp-endpoint=http://robert.com:9080/mcp-servers/higress-weather
agentscope.higress.client-name=higress-weather-consumer
agentscope.higress.client-keyauth=620fd7ce-9aa6-4490-972a-7db7d4901913


# ===== AgentScope DashScope Model =====
agentscope.model.dashscope.api-key=${DASHSCOPE_API_KEY}
agentscope.model.dashscope.model-name=qwen-max
