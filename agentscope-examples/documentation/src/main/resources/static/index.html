<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Router Agent Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: #fff;
            padding: 16px 24px;
            border-bottom: 1px solid #e8e8e8;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header h1 { font-size: 18px; color: #1a1a2e; }
        .header .config {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #666;
        }
        .header .config input {
            width: 60px;
            padding: 4px 8px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            font-size: 13px;
        }
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 14px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .message.user {
            align-self: flex-end;
            background: #1677ff;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .message.assistant {
            align-self: flex-start;
            background: #fff;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        .message.system {
            align-self: center;
            background: #f5f5f5;
            color: #999;
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 8px;
        }
        .event-log {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
            font-family: 'Consolas', monospace;
        }
        .input-area {
            background: #fff;
            padding: 16px 24px;
            border-top: 1px solid #e8e8e8;
            display: flex;
            gap: 12px;
        }
        .input-area textarea {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #d9d9d9;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            outline: none;
            min-height: 44px;
            max-height: 120px;
        }
        .input-area textarea:focus { border-color: #1677ff; }
        .input-area button {
            padding: 10px 24px;
            background: #1677ff;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            align-self: flex-end;
        }
        .input-area button:hover { background: #4096ff; }
        .input-area button:disabled { background: #d9d9d9; cursor: not-allowed; }
        .typing-indicator { color: #999; font-style: italic; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Router Agent Chat</h1>
        <div class="config">
            <label>API:</label>
            <input id="apiUrl" value="http://localhost:18096" style="width:200px" />
        </div>
    </div>

    <div class="chat-area" id="chatArea">
        <div class="message system">输入消息开始对话，SSE 流式输出</div>
    </div>

    <div class="input-area">
        <textarea id="msgInput" placeholder="输入消息... (Enter 发送, Shift+Enter 换行)" rows="1"></textarea>
        <button id="sendBtn" onclick="sendMessage()">发送</button>
    </div>

    <script>
        const chatArea = document.getElementById('chatArea');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');
        const apiUrl = document.getElementById('apiUrl');
        // 每个页面会话使用同一个 conversationId,保证多轮对话共享上下文
        const conversationId = 'conv-' + (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2));

        msgInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Auto-resize textarea
        msgInput.addEventListener('input', () => {
            msgInput.style.height = 'auto';
            msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
        });

        function addMessage(role, text) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.textContent = text;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
            return div;
        }

        function addEventLog(assistantDiv, eventType) {
            let log = assistantDiv.querySelector('.event-log');
            if (!log) {
                log = document.createElement('div');
                log.className = 'event-log';
                assistantDiv.appendChild(log);
            }
            log.textContent += `[${eventType}] `;
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        async function sendMessage() {
            const message = msgInput.value.trim();
            if (!message) return;

            msgInput.value = '';
            msgInput.style.height = 'auto';
            sendBtn.disabled = true;

            addMessage('user', message);
            const assistantDiv = addMessage('assistant', '');
            assistantDiv.innerHTML = '<span class="typing-indicator">思考中...</span>';

            const baseUrl = apiUrl.value.replace(/\/+$/, '');
            let textContent = '';
            let eventCount = 0;

            try {
                const response = await fetch(`${baseUrl}/api/chat/stream`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message, sessionId: conversationId })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';

                    for (const line of lines) {
                        if (line.startsWith('data:')) {
                            const dataStr = line.substring(5).trim();
                            if (!dataStr) continue;
                            try {
                                const event = JSON.parse(dataStr);
                                eventCount++;
                                handleEvent(event, assistantDiv);
                            } catch (e) {
                                // not JSON, might be plain text
                            }
                        } else if (line.startsWith('event:')) {
                            // SSE event name line — informational
                        }
                    }
                }
            } catch (err) {
                assistantDiv.innerHTML = `<span style="color:red">错误: ${err.message}</span>`;
            }

            // Finalize
            if (textContent) {
                assistantDiv.innerHTML = '';
                assistantDiv.textContent = textContent;
            } else if (!assistantDiv.textContent || assistantDiv.querySelector('.typing-indicator')) {
                assistantDiv.textContent = '(无响应)';
            }
            addEventLog(assistantDiv, `DONE (${eventCount} events)`);

            sendBtn.disabled = false;
            msgInput.focus();
        }

        function handleEvent(event, div) {
            const type = event.type;

            switch (type) {
                case 'TEXT_BLOCK_DELTA':
                    // Accumulate text
                    const existing = div.querySelector('.typing-indicator');
                    if (existing) existing.remove();
                    let textSpan = div.querySelector('.text-content');
                    if (!textSpan) {
                        textSpan = document.createElement('span');
                        textSpan.className = 'text-content';
                        div.prepend(textSpan);
                    }
                    textSpan.textContent += event.delta || '';
                    chatArea.scrollTop = chatArea.scrollHeight;
                    break;

                case 'AGENT_START':
                    addEventLog(div, 'START');
                    break;

                case 'TOOL_CALL_START':
                    addEventLog(div, `TOOL:${event.toolCallName}`);
                    break;

                case 'TOOL_CALL_END':
                    addEventLog(div, 'TOOL_END');
                    break;

                case 'TOOL_RESULT_TEXT_DELTA':
                    // Could show tool output too
                    break;

                case 'AGENT_RESULT':
                    // Final result — text already accumulated via deltas
                    break;

                case 'AGENT_END':
                    addEventLog(div, 'END');
                    break;

                default:
                    addEventLog(div, type);
                    break;
            }
        }
    </script>
</body>
</html>
