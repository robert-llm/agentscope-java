# Router Agent Spring Boot Configuration
# Used by RouterAgentApp (Spring Boot application)

# HTTP API server port (default: 18096)
server.port=${SERVER_PORT:18096}

# Spring application name
spring.application.name=router-agent

# SSE text-delta buffer: minimum characters before flushing to client.
# Smaller = lower latency but more events; larger = fewer events but higher latency.
# Set to 0 to disable buffering (every delta is sent immediately).
sse.delta.min-chunk-size=50
